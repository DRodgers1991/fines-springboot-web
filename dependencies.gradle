ext {

    springBootVersion = '4.0.1'
    springSecVersion = '7.0.2'
    thymeLeafVersion = '3.1.3.RELEASE'
    lombokVersion = '1.18.42'
    loggingVersion = '2.25.3'
    swaggerVersion = '2.5.0'
    junitVersion = '5.14.1'

    libs = [
            springBootMvc : "org.springframework.boot:spring-boot-starter-webmvc:${springBootVersion}",
            springbootThyme : "org.springframework.boot:spring-boot-starter-thymeleaf:${springBootVersion}",
            springbootSecurity : "org.springframework.boot:spring-boot-starter-security:${springBootVersion}",
            securityExtras : "org.thymeleaf.extras:thymeleaf-extras-springsecurity6:${thymeLeafVersion}",

            springbootTest : "org.springframework.boot:spring-boot-starter-test:${springBootVersion}",
            springSecTest : "org.springframework.security:spring-security-test:${springSecVersion}",
            springBootSecTest : "org.springframework.boot:spring-boot-starter-security-test:${springBootVersion}",
            springBootWebMvcTest : "org.springframework.boot:spring-boot-starter-webmvc-test:${springBootVersion}",

            junit5 : "org.junit.jupiter:junit-jupiter-engine:${junitVersion}",
            lombok : "org.projectlombok:lombok:${lombokVersion}",

            log4jSlf: "org.apache.logging.log4j:log4j-slf4j2-impl:${loggingVersion}",
            log4jCore: "org.apache.logging.log4j:log4j-slf4j2-impl:${loggingVersion}",
            log4jApi: "org.apache.logging.log4j:log4j-slf4j2-impl:${loggingVersion}"
    ]

    loggingDeps = [
            libs.log4jApi,
            libs.log4jCore,
            libs.log4jSlf
    ]

    springBootDeps = [
            libs.springBootMvc,
            libs.springbootThyme,
            libs.springbootSecurity,
            libs.securityExtras
    ]

}